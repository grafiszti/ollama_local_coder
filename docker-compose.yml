name: lechatonfat

services:
  llama:
    build: .
    container_name: llama-cpp
    restart: unless-stopped

    ports:
      - "${PORT_EXTERNAL}:${PORT_INTERNAL}"

    volumes:
      - ./models:/models
      - llama_cache:/root/.cache/llama.cpp

    env_file:
      - .env

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT_INTERNAL:-8080}/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  searxng:
    image: searxng/searxng:2026.7.26-b060c780d
    container_name: searxng
    restart: unless-stopped

    ports:
      - "127.0.0.1:8081:8080"

    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
      - SEARXNG_SECRET=${SEARXNG_SECRET:-}

    volumes:
      - searxng_data:/etc/searxng

volumes:
  llama_cache:
  searxng_data:
